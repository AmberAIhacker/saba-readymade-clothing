services:
  - type: web
    name: saba-readymade
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate:postgres -w server && npm run build
    startCommand: npm run db:generate:postgres -w server && npm run db:deploy:postgres -w server && npm run db:seed -w server && npm run admin:create -w server && npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
