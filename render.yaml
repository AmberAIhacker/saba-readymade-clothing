services:
  - type: web
    name: saba-readymade
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate -w server && npm run build
    startCommand: npm run db:deploy -w server && npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: saba-readymade-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/saba-readymade.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
